<!doctype html>
<meta charset="utf-8">
<title>Digital praksis · ikon-renderer</title>
<!-- Renderer hvert ikon som to gennemsigtige billeder i samme ramme: selve objektet og dets kontaktskygge. -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';
import { IKONER } from './ikoner.js';

const gl = document.createElement('canvas');
const renderer = new THREE.WebGLRenderer({ canvas: gl, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Fælles kamera: lidt ovenfra, let fra højre
const CAM = { fov: 26, dist: 13.2, elev: 22, azim: 12, target: [0, 1.35, 0.15] };
// Fælles lys: hovedlys fra øverst til venstre, lidt forfra
const KEY = new THREE.Vector3(-0.55, 0.85, 0.45).normalize();

window.renderIkon = async function (spec) {
  const N = spec.passes || 48, size = spec.size || 900;
  const scene = new THREE.Scene();
  scene.environment = envTex;
  const obj = IKONER[spec.id](); scene.add(obj);
  obj.traverse(o => { if (o.isMesh) o.material.envMapIntensity = 0.5; });
  const key = new THREE.DirectionalLight(0xfff4ea, 2.0);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 40 });
  scene.add(key); scene.add(key.target);
  const cam = new THREE.PerspectiveCamera(CAM.fov, 1, 0.1, 100);
  const el = CAM.elev * Math.PI / 180, az = CAM.azim * Math.PI / 180;
  const t = new THREE.Vector3(...CAM.target);
  cam.position.set(t.x + Math.sin(az) * Math.cos(el) * CAM.dist, t.y + Math.sin(el) * CAM.dist, t.z + Math.cos(az) * Math.cos(el) * CAM.dist);
  cam.lookAt(t);
  renderer.setSize(size, size, false);

  const accumulate = (setPass) => {
    const acc = document.createElement('canvas'); acc.width = size; acc.height = size;
    const a = acc.getContext('2d'); a.globalCompositeOperation = 'lighter';
    for (let i = 0; i < N; i++) {
      const jx = ((i * 0.618) % 1) - 0.5, jy = ((i * 0.382 + 0.25) % 1) - 0.5;
      cam.setViewOffset(size, size, jx, jy, size, size);
      setPass(i);
      renderer.render(scene, cam);
      a.globalAlpha = 1 / N; a.drawImage(gl, 0, 0);
    }
    cam.clearViewOffset();
    return acc;
  };
  const jitterDir = (base, amt, i) => {
    const a = i * 2.39996, r = Math.sqrt((i + 0.5) / N) * amt;
    return base.clone().add(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)).normalize();
  };

  // 1) objektet
  const icon = accumulate((i) => { key.position.copy(jitterDir(KEY, 0.12, i)).multiplyScalar(18); });

  // 2) kontaktskygge: objektet usynligt, gulv modtager skygge fra hovedlys + himmel
  const hidden = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  obj.traverse(o => { if (o.isMesh) o.material = hidden; });
  scene.environment = null;
  const shadowMat = new THREE.ShadowMaterial({ color: 0x4a4038, opacity: 1 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), shadowMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const sky = new THREE.Vector3(0, 1, 0);
  const shadow = accumulate((i) => {
    if (i % 3 === 0) { shadowMat.opacity = 0.42; key.position.copy(jitterDir(KEY, 0.18, i)).multiplyScalar(18); }
    else {
      // himmellys fra tilfældige retninger: blød okklusion tæt ved foden
      const a = i * 2.39996, u = ((i * 0.7548) % 1);
      const elv = Math.acos(Math.sqrt(1 - u * 0.4));   // kun høj himmel: ingen lange skygger
      const d = new THREE.Vector3(Math.cos(a) * Math.sin(elv), Math.cos(elv), Math.sin(a) * Math.sin(elv));
      shadowMat.opacity = 0.32; key.position.copy(d).multiplyScalar(18);
    }
  });
  // blød elliptisk maske: skyggen toner helt ud, før den når rammens kant (ingen synlig firkant)
  const sg = shadow.getContext('2d');
  sg.save();
  sg.globalAlpha = 1;                       // nulstil efter akkumuleringen
  sg.globalCompositeOperation = 'destination-in';
  sg.translate(size * 0.5, size * 0.66); sg.scale(1, 0.62);
  const rg = sg.createRadialGradient(0, 0, 0, 0, 0, size * 0.48);
  rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(0.55, 'rgba(0,0,0,0.85)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  sg.fillStyle = rg; sg.fillRect(-size, -size * 2, size * 2, size * 4);
  sg.restore();
  return { icon: icon.toDataURL('image/webp', 0.9), shadow: shadow.toDataURL('image/webp', 0.9) };
};
window.READY = true;
</script>
